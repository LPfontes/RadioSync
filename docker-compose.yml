# RadioSync — ambiente local (Entrega 2)
#
# Hoje a aplicação ainda é um único serviço Go (radiosync). Os demais
# containers são a infraestrutura da arquitetura-alvo (ver docs/c4 e docs/adr)
# e já sobem juntos para que cada integrante possa integrar sua parte:
#
#   gateway     Traefik  — API Gateway / load balancer      (ADR-005)
#   redis       Redis    — estado das estações + Pub/Sub     (ADR-001)
#   rabbitmq    RabbitMQ — fila de transcodificação + DLQ    (ADR-002)
#   minio       MinIO    — armazenamento dos arquivos .opus  (ADR-006)
#   postgres    Postgres — catálogo de faixas e estações     (ADR-006)
#   prometheus  / grafana — observabilidade
#
# Uso:  cp .env.example .env  &&  docker compose up -d --build
#
#   App (via gateway) ......... http://localhost            (ou :8080 direto)
#   Traefik dashboard ......... http://localhost:8081
#   RabbitMQ management ....... http://localhost:15672
#   MinIO console ............. http://localhost:9001
#   Prometheus ................ http://localhost:9090
#   Grafana ................... http://localhost:3000

services:
  # ---------------------------------------------------------------- aplicação
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider
    restart: unless-stopped
    init: true

  radiosync:
    build: .
    image: lpfonts/radiosync:latest
    container_name: radiosync
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - MUSIC_DIR=/app/musicas
      - FRONTEND_DIR=/app/frontend/dist
      - DATA_DIR=/app/data
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET no .env}
      - POT_PROVIDER_URL=http://bgutil-provider:4416
      # Variáveis já disponíveis para a migração (ainda não lidas pelo código):
      - REDIS_URL=redis://redis:6379/0
      - AMQP_URL=amqp://${RABBITMQ_USER:-radiosync}:${RABBITMQ_PASSWORD:-radiosync}@rabbitmq:5672/
      - DATABASE_URL=postgres://${POSTGRES_USER:-radiosync}:${POSTGRES_PASSWORD:-radiosync}@postgres:5432/${POSTGRES_DB:-radiosync}?sslmode=disable
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=musicas
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-radiosync}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-radiosync123}
    volumes:
      - ./musicas:/app/musicas
      - ./data:/app/data
    depends_on:
      - bgutil-provider
      - redis
      - rabbitmq
      - postgres
      - minio
    labels:
      - traefik.enable=true
      - traefik.http.routers.radiosync.rule=PathPrefix(`/`)
      - traefik.http.routers.radiosync.entrypoints=web
      - traefik.http.routers.radiosync.middlewares=api-ratelimit
      - traefik.http.services.radiosync.loadbalancer.server.port=8080
      # Rate limiting no gateway (padrão Rate Limit / Throttling)
      - traefik.http.middlewares.api-ratelimit.ratelimit.average=50
      - traefik.http.middlewares.api-ratelimit.ratelimit.burst=100

  # ------------------------------------------------------------ API Gateway
  gateway:
    # v3.3 não conversa com o Docker Engine 29 (api do docker velha demais),
    # o provider ficava em erro e o gateway devolvia 404 pra tudo
    image: traefik:v3.6
    container_name: radiosync-gateway
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
      - --entrypoints.traefik.address=:8081
      - --metrics.prometheus=true
      - --accesslog=true
    ports:
      - "${GATEWAY_PORT:-80}:80"
      - "8081:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ---------------------------------------------------------- infraestrutura
  redis:
    image: redis:7-alpine
    container_name: radiosync-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: radiosync-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-radiosync}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-radiosync}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: radiosync-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-radiosync}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-radiosync}
      - POSTGRES_DB=${POSTGRES_DB:-radiosync}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radiosync}"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    # a imagem minio/minio saiu do Docker Hub (a MinIO parou de publicar
    # imagens gratuitas), então o pull falhava. essa da Chainguard é pública
    image: cgr.dev/chainguard/minio:latest
    container_name: radiosync-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-radiosync}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-radiosync123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # --------------------------------------------------------- observabilidade
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: radiosync-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: radiosync-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  redis-data:
  rabbitmq-data:
  postgres-data:
  minio-data:
  grafana-data:
