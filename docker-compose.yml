# RadioSync — ambiente local (Entrega 2)
#
# Hoje a aplicação ainda é um único serviço Go (radiosync). Os demais
# containers são a infraestrutura da arquitetura-alvo (ver docs/c4 e docs/adr)
# e já sobem juntos para que cada integrante possa integrar sua parte:
#
#   gateway     Traefik  — API Gateway / load balancer      (ADR-005)
#   redis       Redis    — estado das estações + Pub/Sub     (ADR-001)
#   rabbitmq    RabbitMQ — fila de transcodificação + DLQ    (ADR-002)
#   minio       MinIO    — armazenamento dos arquivos .opus  (ADR-006)
#   postgres    Postgres — catálogo de faixas e estações     (ADR-006)
#   prometheus  / grafana — observabilidade
#
# Uso:  cp .env.example .env  &&  docker compose up -d --build
#
#   App (via gateway) ......... http://localhost            (ou :8080 direto)
#   Traefik dashboard ......... http://localhost:8081/dashboard/ (senha: scripts/traefik-dashboard-password.sh)
#   RabbitMQ management ....... http://localhost:15672
#   MinIO console ............. http://localhost:9001
#   Prometheus ................ http://localhost:9090
#   Grafana ................... http://localhost:3000

services:
  # ---------------------------------------------------------------- aplicação
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider
    restart: unless-stopped
    init: true

  # Sync Service: extraído do monolito (Strangler Fig, ADR-0001, ADR-0003).
  # Gerencia WebSockets, sincronização e Hub com fan-out via Redis Pub/Sub.
  # Escala horizontalmente com: docker compose up -d --scale sync=N
  sync:
    build:
      context: .
      dockerfile: Dockerfile.sync
    image: ${RADIOSYNC_SYNC_IMAGE:-lpfonts/radiosync-sync}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      # Tracing (OpenTelemetry -> Jaeger). Desliga com OTEL_EXPORTER_OTLP_ENDPOINT vazio.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4318}
      - OTEL_SERVICE_NAME=radiosync-sync
      - PORT=8082
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET no .env}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.sync.rule=PathPrefix(`/ws/`) || PathPrefix(`/ws`)
      - traefik.http.routers.sync.entrypoints=web
      - traefik.http.routers.sync.priority=100
      - traefik.http.services.sync.loadbalancer.server.port=8082

  # Station Service: extraído do monolito (Strangler Fig, ADR-0003, ADR-0006).
  # Gerencia estações, playlist, biblioteca global, claim-dj (PostgreSQL + Redis)
  # e entrega de áudio .opus diretamente do MinIO sem depender de disco local.
  # Escala horizontalmente com: docker compose up -d --scale station=N
  station:
    build:
      context: .
      dockerfile: Dockerfile.station
    image: ${RADIOSYNC_STATION_IMAGE:-lpfonts/radiosync-station}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      # Tracing (OpenTelemetry -> Jaeger). Desliga com OTEL_EXPORTER_OTLP_ENDPOINT vazio.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4318}
      - OTEL_SERVICE_NAME=radiosync-station
      - PORT=8083
      - APP_VERSION=${IMAGE_TAG:-dev}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET no .env}
      - DJ_TOKEN_TTL=${DJ_TOKEN_TTL:-24h}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://${POSTGRES_USER:-radiosync}:${POSTGRES_PASSWORD:-radiosync}@postgres:5432/${POSTGRES_DB:-radiosync}?sslmode=disable
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=musicas
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-radiosync}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-radiosync123}
      - DATA_DIR=/app/data
      - MUSIC_DIR=/app/musicas
    volumes:
      - ./musicas:/app/musicas:ro
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.services.station.loadbalancer.server.port=8083
      # Criar estação -> Station Service (com rate limit de 10/min, burst 5)
      - traefik.http.routers.station-create.rule=Method(`POST`) && (Path(`/api/v1/stations`) || Path(`/api/v1/stations/`))
      - traefik.http.routers.station-create.entrypoints=web
      - traefik.http.routers.station-create.priority=95
      - traefik.http.routers.station-create.service=station
      - traefik.http.routers.station-create.middlewares=create-station-ratelimit
      # Assumir DJ -> Station Service (com rate limit de 10/min, burst 5)
      - traefik.http.routers.station-claim-dj.rule=Method(`POST`) && PathRegexp(`^/api/v1/stations/[^/]+/claim-dj$`)
      - traefik.http.routers.station-claim-dj.entrypoints=web
      - traefik.http.routers.station-claim-dj.priority=95
      - traefik.http.routers.station-claim-dj.service=station
      - traefik.http.routers.station-claim-dj.middlewares=claim-dj-ratelimit
      # Rotas /api/v1/stations* (exceto upload/youtube/cookies do Media Service), /api/v1/library e /musicas/*
      - traefik.http.routers.station-api.rule=(PathPrefix(`/api/v1/stations`) && !PathRegexp(`^/api/v1/stations/[^/]+/(upload|youtube|cookies.*)$`)) || Path(`/api/v1/library`) || PathPrefix(`/musicas/`)
      - traefik.http.routers.station-api.entrypoints=web
      - traefik.http.routers.station-api.priority=85
      - traefik.http.routers.station-api.service=station
      - traefik.http.routers.station-api.middlewares=api-ratelimit

  # Media API: extraída do monolito (Strangler Fig, ADR-0002, ADR-0003). Valida o
  # upload/link, guarda o original no MinIO, publica em media.transcode e responde
  # 202. Sem FFmpeg nem yt-dlp. Escala com: docker compose up -d --scale media=N
  media:
    build:
      context: .
      dockerfile: Dockerfile.media
    image: ${RADIOSYNC_MEDIA_IMAGE:-lpfonts/radiosync-media}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      # Tracing (OpenTelemetry -> Jaeger). Desliga com OTEL_EXPORTER_OTLP_ENDPOINT vazio.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4318}
      - OTEL_SERVICE_NAME=radiosync-media
      - PORT=8084
      - APP_VERSION=${IMAGE_TAG:-dev}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET no .env}
      # Só para validar o token nas rotas de admin (cookies)
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - MEDIA_RETRY_DELAYS=${MEDIA_RETRY_DELAYS:-5s,30s,2m}
      - MEDIA_MAX_UPLOAD_MB=100
      - REDIS_URL=redis://redis:6379/0
      - AMQP_URL=amqp://${RABBITMQ_USER:-radiosync}:${RABBITMQ_PASSWORD:-radiosync}@rabbitmq:5672/
      - DATABASE_URL=postgres://${POSTGRES_USER:-radiosync}:${POSTGRES_PASSWORD:-radiosync}@postgres:5432/${POSTGRES_DB:-radiosync}?sslmode=disable
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=musicas
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-radiosync}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-radiosync123}
      - DATA_DIR=/app/data
    volumes:
      # cookies.txt do YouTube, lido pelos workers
      - media-data:/app/data
    depends_on:
      # O Station Service é dono do schema: as migrations rodam nele
      station:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    labels:
      - traefik.enable=true
      - traefik.http.services.media.loadbalancer.server.port=8084
      # Upload e YouTube: cada pedido vira um job de CPU pesada no worker. 6/min
      # (burst 3), no máximo 2 em andamento por IP e corpo até 100 MB (acima, 413)
      - traefik.http.routers.media.rule=Method(`POST`) && PathRegexp(`^/api/v1/stations/[^/]+/(upload|youtube)$`)
      - traefik.http.routers.media.entrypoints=web
      - traefik.http.routers.media.priority=90
      - traefik.http.routers.media.service=media
      - traefik.http.routers.media.middlewares=media-ratelimit,media-inflight,media-bodylimit
      - traefik.http.middlewares.media-ratelimit.ratelimit.average=6
      - traefik.http.middlewares.media-ratelimit.ratelimit.period=1m
      - traefik.http.middlewares.media-ratelimit.ratelimit.burst=3
      - traefik.http.middlewares.media-inflight.inflightreq.amount=2
      - traefik.http.middlewares.media-inflight.inflightreq.sourcecriterion.ipstrategy.depth=0
      - traefik.http.middlewares.media-bodylimit.buffering.maxRequestBodyBytes=104857600
      # Andamento dos jobs e cookies do YouTube
      - traefik.http.routers.media-jobs.rule=PathRegexp(`^/api/v1/stations/[^/]+/(jobs(/[^/]+)?|cookies(/status)?)$`)
      - traefik.http.routers.media-jobs.entrypoints=web
      - traefik.http.routers.media-jobs.priority=90
      - traefik.http.routers.media-jobs.service=media
      - traefik.http.routers.media-jobs.middlewares=api-ratelimit
      - traefik.http.routers.media-admin-cookies.rule=Path(`/api/v1/admin/cookies`)
      - traefik.http.routers.media-admin-cookies.entrypoints=web
      - traefik.http.routers.media-admin-cookies.priority=105
      - traefik.http.routers.media-admin-cookies.service=media
      - traefik.http.routers.media-admin-cookies.middlewares=api-ratelimit,admin-auth

  # Media Worker: única imagem com FFmpeg e yt-dlp (bulkhead, ADR-0002). Consome
  # media.transcode com ack manual. Escala com: docker compose up -d --scale media-worker=N
  media-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: ${RADIOSYNC_WORKER_IMAGE:-lpfonts/radiosync-worker}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 20s
    # Limite por réplica: a conversão não toma a CPU da API e do WebSocket
    cpus: ${WORKER_CPUS:-1.5}
    mem_limit: ${WORKER_MEMORY:-1g}
    environment:
      # Tracing (OpenTelemetry -> Jaeger). Desliga com OTEL_EXPORTER_OTLP_ENDPOINT vazio.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4318}
      - OTEL_SERVICE_NAME=radiosync-worker
      - PORT=8085
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      - MEDIA_JOB_TIMEOUT=${MEDIA_JOB_TIMEOUT:-10m}
      - MEDIA_RETRY_DELAYS=${MEDIA_RETRY_DELAYS:-5s,30s,2m}
      - YT_BREAKER_FAILURES=${YT_BREAKER_FAILURES:-5}
      - YT_BREAKER_COOLDOWN=${YT_BREAKER_COOLDOWN:-60s}
      - POT_PROVIDER_URL=http://bgutil-provider:4416
      - REDIS_URL=redis://redis:6379/0
      - AMQP_URL=amqp://${RABBITMQ_USER:-radiosync}:${RABBITMQ_PASSWORD:-radiosync}@rabbitmq:5672/
      - DATABASE_URL=postgres://${POSTGRES_USER:-radiosync}:${POSTGRES_PASSWORD:-radiosync}@postgres:5432/${POSTGRES_DB:-radiosync}?sslmode=disable
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=musicas
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-radiosync}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-radiosync123}
      - DATA_DIR=/app/data
    volumes:
      - media-data:/app/data:ro
    depends_on:
      bgutil-provider:
        condition: service_started
      # A Media API só sobe depois das migrations e cria o volume com o dono certo
      media:
        condition: service_healthy

  radiosync:
    build: .
    # Tag imutável por versão (SHA do commit), definida pelo scripts/deploy.sh.
    # Sem IMAGE_TAG cai em "latest" (desenvolvimento local).
    image: ${RADIOSYNC_IMAGE:-lpfonts/radiosync}:${IMAGE_TAG:-latest}
    container_name: radiosync
    restart: unless-stopped
    # Tempo para o salvamento final do estado no SIGTERM (ADR-0007)
    stop_grace_period: 20s
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      # Tracing (OpenTelemetry -> Jaeger). Desliga com OTEL_EXPORTER_OTLP_ENDPOINT vazio.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4318}
      - OTEL_SERVICE_NAME=radiosync-server
      - PORT=8080
      # Origens extras para CORS/WebSocket (vírgula). Vazio = só a mesma origem
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - MUSIC_DIR=/app/musicas
      - FRONTEND_DIR=/app/frontend/dist
      - APP_VERSION=${IMAGE_TAG:-dev}
      - DATA_DIR=/app/data
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET no .env}
      # Sem ADMIN_PASSWORD as rotas /api/v1/admin respondem 503 (seguro por padrão)
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_TOKEN_TTL=${ADMIN_TOKEN_TTL:-8h}
      - DJ_TOKEN_TTL=${DJ_TOKEN_TTL:-24h}
      # Variáveis já disponíveis para a migração (ainda não lidas pelo código):
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgres://${POSTGRES_USER:-radiosync}:${POSTGRES_PASSWORD:-radiosync}@postgres:5432/${POSTGRES_DB:-radiosync}?sslmode=disable
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=musicas
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-radiosync}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-radiosync123}
    volumes:
      - ./musicas:/app/musicas
      - ./data:/app/data
    depends_on:
      - redis
      - postgres
      - minio
    labels:
      - traefik.enable=true
      - traefik.http.routers.radiosync.rule=PathPrefix(`/`)
      - traefik.http.routers.radiosync.entrypoints=web
      - traefik.http.routers.radiosync.middlewares=api-ratelimit
      - traefik.http.services.radiosync.loadbalancer.server.port=8080
      # ---- Limites por rota (ADR-0005), mais rígidos que o global, por IP ----
      # Criar estação: evita criação em massa de salas (10/min, burst 5)
      - traefik.http.routers.radiosync-create-station.rule=Method(`POST`) && (Path(`/api/v1/stations`) || Path(`/api/v1/stations/`))
      - traefik.http.routers.radiosync-create-station.entrypoints=web
      - traefik.http.routers.radiosync-create-station.priority=90
      - traefik.http.routers.radiosync-create-station.service=radiosync
      - traefik.http.routers.radiosync-create-station.middlewares=create-station-ratelimit
      - traefik.http.middlewares.create-station-ratelimit.ratelimit.average=10
      - traefik.http.middlewares.create-station-ratelimit.ratelimit.period=1m
      - traefik.http.middlewares.create-station-ratelimit.ratelimit.burst=5
      # Assumir DJ: evita ficar tomando a bancada em loop (10/min, burst 5)
      - traefik.http.routers.radiosync-claim-dj.rule=Method(`POST`) && PathRegexp(`^/api/v1/stations/[^/]+/claim-dj$`)
      - traefik.http.routers.radiosync-claim-dj.entrypoints=web
      - traefik.http.routers.radiosync-claim-dj.priority=90
      - traefik.http.routers.radiosync-claim-dj.service=radiosync
      - traefik.http.routers.radiosync-claim-dj.middlewares=claim-dj-ratelimit
      - traefik.http.middlewares.claim-dj-ratelimit.ratelimit.average=10
      - traefik.http.middlewares.claim-dj-ratelimit.ratelimit.period=1m
      - traefik.http.middlewares.claim-dj-ratelimit.ratelimit.burst=5
      # Rate limiting no gateway (padrão Rate Limit / Throttling)
      - traefik.http.middlewares.api-ratelimit.ratelimit.average=50
      - traefik.http.middlewares.api-ratelimit.ratelimit.burst=100
      # Rotas de admin e diagnóstico: o gateway valida o JWT de admin antes de
      # repassar (ForwardAuth -> /api/v1/admin/verify). O Go valida de novo,
      # então o acesso direto pela porta 8080 também fica protegido (ADR-0005).
      - traefik.http.routers.radiosync-admin.rule=(PathPrefix(`/api/v1/admin`) && !Path(`/api/v1/admin/login`)) || Path(`/api/v1/debug`)
      - traefik.http.routers.radiosync-admin.entrypoints=web
      - traefik.http.routers.radiosync-admin.priority=100
      - traefik.http.routers.radiosync-admin.service=radiosync
      - traefik.http.routers.radiosync-admin.middlewares=api-ratelimit,admin-auth
      - traefik.http.middlewares.admin-auth.forwardauth.address=http://radiosync:8080/api/v1/admin/verify
      # Login de admin: limite rígido por IP contra força bruta (5/min, burst 5)
      - traefik.http.routers.radiosync-admin-login.rule=Path(`/api/v1/admin/login`)
      - traefik.http.routers.radiosync-admin-login.entrypoints=web
      - traefik.http.routers.radiosync-admin-login.priority=110
      - traefik.http.routers.radiosync-admin-login.service=radiosync
      - traefik.http.routers.radiosync-admin-login.middlewares=admin-login-ratelimit
      - traefik.http.middlewares.admin-login-ratelimit.ratelimit.average=5
      - traefik.http.middlewares.admin-login-ratelimit.ratelimit.period=1m
      - traefik.http.middlewares.admin-login-ratelimit.ratelimit.burst=5

  # ------------------------------------------------------------ API Gateway
  gateway:
    # v3.3 não conversa com o Docker Engine 29 (api do docker velha demais),
    # o provider ficava em erro e o gateway devolvia 404 pra tudo
    image: traefik:v3.6
    container_name: radiosync-gateway
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      # Sem --api.insecure: o dashboard só abre pelo router com senha de
      # infra/traefik/dashboard.yml (ADR-0005)
      - --providers.file.filename=/etc/traefik/dynamic/dashboard.yml
      - --entrypoints.traefik.address=:8081
      - --metrics.prometheus=true
      - --accesslog=true
      # Tracing: o gateway abre o trace e propaga o traceparent para os serviços
      - --tracing=true
      - --tracing.serviceName=gateway
      - --tracing.otlp.http.endpoint=http://jaeger:4318/v1/traces
    ports:
      - "${GATEWAY_PORT:-80}:80"
      # Dashboard e /metrics só na máquina local (use um túnel SSH no servidor).
      # Para expor, defina TRAEFIK_DASHBOARD_BIND=0.0.0.0 no .env.
      - "${TRAEFIK_DASHBOARD_BIND:-127.0.0.1}:8081:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik:/etc/traefik/dynamic:ro

  # ---------------------------------------------------------- infraestrutura
  redis:
    image: redis:7-alpine
    container_name: radiosync-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: radiosync-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-radiosync}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-radiosync}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: radiosync-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-radiosync}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-radiosync}
      - POSTGRES_DB=${POSTGRES_DB:-radiosync}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radiosync}"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    # a imagem minio/minio saiu do Docker Hub (a MinIO parou de publicar
    # imagens gratuitas), então o pull falhava. essa da Chainguard é pública
    image: cgr.dev/chainguard/minio:latest
    container_name: radiosync-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-radiosync}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-radiosync123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # --------------------------------------------------------- observabilidade
  jaeger:
    # Jaeger v2: recebe OTLP (4318 HTTP) e guarda os traces em memória. A UI fica
    # em http://localhost:16686. Em memória: os traces somem ao reiniciar o container.
    image: jaegertracing/jaeger:2.10.0
    container_name: radiosync-jaeger
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_BIND:-127.0.0.1}:16686:16686"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: radiosync-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: radiosync-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  media-data:
  redis-data:
  rabbitmq-data:
  postgres-data:
  minio-data:
  grafana-data:
