services:
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider
    restart: unless-stopped
    init: true

  radiosync:
    build: .
    container_name: radiosync
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - MUSIC_DIR=/app/musicas
      - FRONTEND_DIR=/app/frontend/dist
      - DATA_DIR=/app/data
      - JWT_SECRET=${JWT_SECRET}
      - POT_PROVIDER_URL=http://bgutil-provider:4416
    volumes:
      - ./musicas:/app/musicas
      - ./data:/app/data
    depends_on:
      - bgutil-provider

