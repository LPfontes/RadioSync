global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Métricas do API Gateway (requisições, latência, códigos HTTP)
  - job_name: traefik
    static_configs:
      - targets: ["gateway:8081"]

  # Monólito (cmd/server): latência e erros HTTP por rota. O /metrics fica numa
  # porta interna (9100), fora do roteador público, porque o gateway encaminha
  # qualquer caminho para este serviço.
  - job_name: radiosync
    metrics_path: /metrics
    static_configs:
      - targets: ["radiosync:9100"]

  # Métricas do Sync Service (conexões ativas, mensagens por segundo, fan-out)
  - job_name: sync
    metrics_path: /metrics
    # dns_sd: cada réplica (--scale sync=N) vira um alvo e uma série própria. Com um
    # nome fixo ("sync:8082") o DNS do Compose devolve uma réplica diferente a cada
    # raspagem e os contadores de todas se misturam numa série só.
    dns_sd_configs:
      - names: ["sync"]
        type: A
        port: 8082
        refresh_interval: 10s

  # Station Service (ADR-0003/0006): latência e erros HTTP por rota. As réplicas
  # (--scale station=N) aparecem pelo DNS do Compose.
  - job_name: station
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["station"]
        type: A
        port: 8083
        refresh_interval: 10s

  # Frente de mídia (ADR-0002): filas, jobs, tentativas e circuit breaker. O DNS
  # do Compose devolve o IP de cada réplica (--scale media=N, media-worker=N).
  - job_name: media
    dns_sd_configs:
      - names: ["media"]
        type: A
        port: 8084
        refresh_interval: 10s
  - job_name: media-worker
    dns_sd_configs:
      - names: ["media-worker"]
        type: A
        port: 8085
        refresh_interval: 10s
