global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Métricas do API Gateway (requisições, latência, códigos HTTP)
  - job_name: traefik
    static_configs:
      - targets: ["gateway:8081"]

  # Métricas da aplicação: o endpoint /metrics ainda será criado no backend Go
  # (tarefa do Membro 5). Até lá, este alvo aparece como DOWN no Prometheus.
  - job_name: radiosync
    metrics_path: /metrics
    static_configs:
      - targets: ["radiosync:8080"]
