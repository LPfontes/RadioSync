global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Métricas do API Gateway (requisições, latência, códigos HTTP)
  - job_name: traefik
    static_configs:
      - targets: ["gateway:8081"]

  # Métricas da aplicação: o endpoint /metrics ainda será criado no backend Go
  # (tarefa do Membro 5). Até lá, este alvo aparece como DOWN no Prometheus.
  - job_name: radiosync
    metrics_path: /metrics
    static_configs:
      - targets: ["radiosync:8080"]

  # Métricas do Sync Service (conexões ativas, mensagens por segundo, fan-out)
  - job_name: sync
    metrics_path: /metrics
    static_configs:
      - targets: ["sync:8082"]

  # Frente de mídia (ADR-0002): filas, jobs, tentativas e circuit breaker. O DNS
  # do Compose devolve o IP de cada réplica (--scale media=N, media-worker=N).
  - job_name: media
    dns_sd_configs:
      - names: ["media"]
        type: A
        port: 8084
        refresh_interval: 10s
  - job_name: media-worker
    dns_sd_configs:
      - names: ["media-worker"]
        type: A
        port: 8085
        refresh_interval: 10s
