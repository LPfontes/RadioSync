name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go) — vet, testes, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: Testes (com detector de race condition)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Cobertura
        run: go tool cover -func=coverage.out | tail -1

      - name: Build
        run: CGO_ENABLED=0 go build -o server ./cmd/server/

  frontend:
    name: Frontend (Vue) — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  docker:
    name: Imagem Docker + Compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        run: JWT_SECRET=ci docker compose config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: radiosync:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
