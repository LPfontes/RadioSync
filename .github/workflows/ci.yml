name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go) — vet, testes, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Mesmas versões do docker-compose.yml. Sem elas os testes de integração
    # caem nas implementações em memória e não exercitam SQL nem AMQP.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: radiosync
          POSTGRES_PASSWORD: radiosync
          POSTGRES_DB: radiosync
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U radiosync" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports: ["5672:5672"]
        options: --health-cmd "rabbitmq-diagnostics -q check_port_connectivity" --health-start-period 20s --health-interval 15s --health-timeout 10s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://radiosync:radiosync@localhost:5432/radiosync?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
      TEST_AMQP_URL: amqp://guest:guest@localhost:5672/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: Testes (com detector de race condition)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Cobertura
        run: go tool cover -func=coverage.out | tail -1

      - name: Build
        run: CGO_ENABLED=0 go build ./...

  frontend:
    name: Frontend (Vue) — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  docker:
    name: Imagem Docker + Compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        run: JWT_SECRET=ci docker compose config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: radiosync:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
